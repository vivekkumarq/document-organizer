services:
  db:
    image: postgres:16-alpine
    container_name: docorganizer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docorganizer}
      POSTGRES_USER: ${POSTGRES_USER:-docorganizer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docorganizer}
    volumes:
      - docorganizer_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docorganizer} -d ${POSTGRES_DB:-docorganizer}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published by default: only the backend needs to reach it. Uncomment to
    # connect a local client.
    # ports:
    #   - "5432:5432"

  backend:
    build:
      context: ./docorganizer
    container_name: docorganizer-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-docorganizer}
      DB_USERNAME: ${POSTGRES_USER:-docorganizer}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-docorganizer}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env - at least 32 characters}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      STORAGE_DIR: /app/storage
      STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES:-104857600}
      STORAGE_MAX_FILE_SIZE_BYTES: ${STORAGE_MAX_FILE_SIZE_BYTES:-10485760}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-16MB}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-20MB}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - docorganizer_storage:/app/storage
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./docorganizer-ui
      args:
        # Vite inlines this at build time, so it must be the URL the browser
        # uses, not the internal service name.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: docorganizer-ui
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  docorganizer_db:
  docorganizer_storage:
