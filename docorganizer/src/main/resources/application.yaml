spring:
  application:
    name: docorganizer

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/docorganizer}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      # Container-level ceiling. The application-level limit is app.storage.max-file-size-bytes
      # and should be the lower of the two so uploads fail with a readable JSON error.
      max-file-size: ${MAX_UPLOAD_SIZE:16MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # Leave blank for local development: an ephemeral key is generated at startup.
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  storage:
    dir: ${STORAGE_DIR:../storage}
    quota-bytes: ${STORAGE_QUOTA_BYTES:104857600}
    max-file-size-bytes: ${STORAGE_MAX_FILE_SIZE_BYTES:10485760}
    # Comma-separated MIME types accepted at upload. Set to an empty value to
    # accept anything (not recommended).
    allowed-content-types: ${STORAGE_ALLOWED_CONTENT_TYPES:application/pdf,image/png,image/jpeg,image/gif,image/webp,text/plain,text/csv,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.vivek.docorganizer: ${LOG_LEVEL:INFO}
